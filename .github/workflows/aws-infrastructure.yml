name: aws-infrastructure

on:
  pull_request:
    paths:
      - "infrastructure/aws/bootstrap/**"
      - ".github/workflows/aws-infrastructure.yml"
  push:
    branches:
      - main
    paths:
      - "infrastructure/aws/bootstrap/**"

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: infrastructure/aws/bootstrap
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.11.0
      - run: tofu fmt -check -recursive
      - run: tofu init -backend=false
      - run: tofu validate

  apply:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infrastructure/aws/bootstrap
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.11.0
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_BOOTSTRAP_ROLE_ARN }}
          aws-region: ca-central-1
      - name: Write S3 backend block
        run: |
          cat > backend.tf <<'EOF'
          terraform {
            backend "s3" {}
          }
          EOF
      - run: |
          tofu init \
            -backend-config="bucket=${{ vars.AWS_STATE_BUCKET }}" \
            -backend-config="key=aws/bootstrap/global.tfstate" \
            -backend-config="region=ca-central-1" \
            -backend-config="dynamodb_table=${{ vars.AWS_STATE_LOCK_TABLE }}" \
            -backend-config="encrypt=true"
      - run: tofu apply -auto-approve
