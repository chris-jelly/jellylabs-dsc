name: aws-infrastructure

on:
  pull_request:
    paths:
      - "infrastructure/aws/**"
      - ".github/workflows/aws-infrastructure.yml"
      - "scripts/detect_aws_roots.py"
      - "scripts/test_detect_aws_roots.py"
  push:
    branches:
      - main
    paths:
      - "infrastructure/aws/**"
      - ".github/workflows/aws-infrastructure.yml"
      - "scripts/detect_aws_roots.py"
      - "scripts/test_detect_aws_roots.py"

jobs:
  detect-roots:
    runs-on: ubuntu-latest
    outputs:
      validate_roots: ${{ steps.roots.outputs.validate_roots }}
      plan_roots: ${{ steps.roots.outputs.plan_roots }}
      apply_roots: ${{ steps.roots.outputs.apply_roots }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: roots
        name: Detect changed AWS roots
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
          else
            base="$PUSH_BEFORE_SHA"
          fi

          python3 scripts/detect_aws_roots.py \
            --event-name "$EVENT_NAME" \
            --base-sha "$base" \
            --head-sha "$HEAD_SHA"

  validate:
    if: github.event_name == 'pull_request' && needs.detect-roots.outputs.validate_roots != '[]'
    needs: detect-roots
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        root: ${{ fromJson(needs.detect-roots.outputs.validate_roots) }}
    defaults:
      run:
        working-directory: infrastructure/aws/${{ matrix.root }}
    steps:
      - uses: actions/checkout@v6
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.11.0
      - run: tofu fmt -check -recursive
      - run: tofu init -backend=false
      - run: tofu validate

  plan:
    if: github.event_name == 'pull_request' && needs.detect-roots.outputs.plan_roots != '[]'
    needs:
      - detect-roots
      - validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        root: ${{ fromJson(needs.detect-roots.outputs.plan_roots) }}
    defaults:
      run:
        working-directory: infrastructure/aws/${{ matrix.root }}
    steps:
      - uses: actions/checkout@v6
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.11.0
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ca-central-1
      - name: Write S3 backend block
        run: |
          cat > backend.tf <<'EOF'
          terraform {
            backend "s3" {}
          }
          EOF
      - run: |
          tofu init \
            -backend-config="bucket=${{ vars.AWS_STATE_BUCKET }}" \
            -backend-config="key=aws/${{ matrix.root }}/global.tfstate" \
            -backend-config="region=ca-central-1" \
            -backend-config="dynamodb_table=${{ vars.AWS_STATE_LOCK_TABLE }}" \
            -backend-config="encrypt=true"
      - id: plan
        name: Run OpenTofu plan
        run: |
          set +e
          tofu plan -detailed-exitcode -no-color -out=tfplan > plan.out 2>&1
          status=$?
          set -e

          if [ "$status" -eq 1 ]; then
            cat plan.out
            exit 1
          fi

          tofu show -no-color tfplan > plan.txt

          if [ "$status" -eq 2 ]; then
            result="changes"
          else
            result="no changes"
          fi

          summary_line=$(grep -E 'Plan: [0-9]+ to add, [0-9]+ to change, [0-9]+ to destroy\.' plan.out || true)
          if [ -z "$summary_line" ]; then
            summary_line="No changes."
          fi

          {
            echo "result=$result"
            echo "summary_line=$summary_line"
          } >> "$GITHUB_OUTPUT"
      - name: Write plan summary
        run: |
          {
            echo "## AWS OpenTofu plan: ${{ matrix.root }}"
            echo
            echo "**Result:** ${{ steps.plan.outputs.result }}"
            echo
            echo '${{ steps.plan.outputs.summary_line }}'
            echo
            echo '<details><summary>Plan details</summary>'
            echo
            echo '```text'
            cat plan.txt
            echo '```'
            echo
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Write PR comment body
        run: |
          cat > plan-comment.md <<'EOF'
          <!-- aws-infrastructure-plan:${{ matrix.root }} -->
          ## AWS OpenTofu plan: `${{ matrix.root }}`

          **Result:** ${{ steps.plan.outputs.result }}

          ${{ steps.plan.outputs.summary_line }}

          See the workflow job summary for plan details.
          EOF
      - name: Publish PR plan comment
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs')
            const marker = '<!-- aws-infrastructure-plan:${{ matrix.root }} -->'
            const body = fs.readFileSync('infrastructure/aws/${{ matrix.root }}/plan-comment.md', 'utf8')
            const { owner, repo } = context.repo
            const issue_number = context.issue.number
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
            })
            const existing = comments.find(comment => comment.body?.includes(marker))
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              })
            }

  apply:
    if: github.event_name == 'push' && needs.detect-roots.outputs.apply_roots != '[]'
    needs: detect-roots
    runs-on: ubuntu-latest
    environment: aws-production
    concurrency:
      group: aws-production-${{ matrix.root }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        root: ${{ fromJson(needs.detect-roots.outputs.apply_roots) }}
    defaults:
      run:
        working-directory: infrastructure/aws/${{ matrix.root }}
    steps:
      - uses: actions/checkout@v6
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.11.0
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_MAIN_ROLE_ARN }}
          aws-region: ca-central-1
      - name: Write S3 backend block
        run: |
          cat > backend.tf <<'EOF'
          terraform {
            backend "s3" {}
          }
          EOF
      - run: |
          tofu init \
            -backend-config="bucket=${{ vars.AWS_STATE_BUCKET }}" \
            -backend-config="key=aws/${{ matrix.root }}/global.tfstate" \
            -backend-config="region=ca-central-1" \
            -backend-config="dynamodb_table=${{ vars.AWS_STATE_LOCK_TABLE }}" \
            -backend-config="encrypt=true"
      - run: tofu fmt -check -recursive
      - run: tofu validate
      - run: tofu apply -auto-approve
