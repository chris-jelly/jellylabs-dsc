name: aws-infrastructure

on:
  pull_request:
    paths:
      - "infrastructure/aws/**"
      - ".github/workflows/aws-infrastructure.yml"
  push:
    branches:
      - main
    paths:
      - "infrastructure/aws/**"
      - ".github/workflows/aws-infrastructure.yml"

jobs:
  detect-roots:
    runs-on: ubuntu-latest
    outputs:
      validate_roots: ${{ steps.roots.outputs.validate_roots }}
      apply_roots: ${{ steps.roots.outputs.apply_roots }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: roots
        name: Detect changed AWS roots
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
          else
            base="$PUSH_BEFORE_SHA"
          fi

          git diff --name-only "$base" "$HEAD_SHA" > changed-files.txt

          python3 <<'PY'
          import json
          import os
          from pathlib import Path

          manual_roots = {"bootstrap", "identity"}
          workflow_path = ".github/workflows/aws-infrastructure.yml"

          changed_files = [
              line.strip()
              for line in Path("changed-files.txt").read_text().splitlines()
              if line.strip()
          ]

          def is_aws_root(root: str) -> bool:
              root_path = Path("infrastructure/aws") / root
              return root_path.is_dir() and any(root_path.glob("*.tf"))

          all_roots = sorted(
              path.name
              for path in Path("infrastructure/aws").iterdir()
              if path.is_dir() and is_aws_root(path.name)
          )

          changed_roots = set()
          workflow_changed = workflow_path in changed_files

          for file_path in changed_files:
              parts = Path(file_path).parts
              if len(parts) >= 4 and parts[0] == "infrastructure" and parts[1] == "aws":
                  root = parts[2]
                  if is_aws_root(root):
                      changed_roots.add(root)

          if os.environ["EVENT_NAME"] == "pull_request" and workflow_changed:
              validate_roots = all_roots
          else:
              validate_roots = sorted(changed_roots)

          apply_roots = sorted(root for root in changed_roots if root not in manual_roots)

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"validate_roots={json.dumps(validate_roots)}\n")
              output.write(f"apply_roots={json.dumps(apply_roots)}\n")

          print("Changed files:", json.dumps(changed_files))
          print("Validation roots:", json.dumps(validate_roots))
          print("Apply roots:", json.dumps(apply_roots))
          PY

  validate:
    if: github.event_name == 'pull_request' && needs.detect-roots.outputs.validate_roots != '[]'
    needs: detect-roots
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        root: ${{ fromJson(needs.detect-roots.outputs.validate_roots) }}
    defaults:
      run:
        working-directory: infrastructure/aws/${{ matrix.root }}
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.11.0
      - run: tofu fmt -check -recursive
      - run: tofu init -backend=false
      - run: tofu validate

  apply:
    if: github.event_name == 'push' && needs.detect-roots.outputs.apply_roots != '[]'
    needs: detect-roots
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        root: ${{ fromJson(needs.detect-roots.outputs.apply_roots) }}
    defaults:
      run:
        working-directory: infrastructure/aws/${{ matrix.root }}
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.11.0
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_MAIN_ROLE_ARN }}
          aws-region: ca-central-1
      - name: Write S3 backend block
        run: |
          cat > backend.tf <<'EOF'
          terraform {
            backend "s3" {}
          }
          EOF
      - run: |
          tofu init \
            -backend-config="bucket=${{ vars.AWS_STATE_BUCKET }}" \
            -backend-config="key=aws/${{ matrix.root }}/global.tfstate" \
            -backend-config="region=ca-central-1" \
            -backend-config="dynamodb_table=${{ vars.AWS_STATE_LOCK_TABLE }}" \
            -backend-config="encrypt=true"
      - run: tofu fmt -check -recursive
      - run: tofu validate
      - run: tofu apply -auto-approve
